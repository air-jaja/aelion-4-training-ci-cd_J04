# =============================================================================
# FICHIER : monitoring/prometheus.yml
# ROLE    : dire a Prometheus QUOI collecter, OU, et COMMENT s'authentifier.
# -----------------------------------------------------------------------------
# POURQUOI UNE AUTHENTIFICATION ICI ?
#
# Le durcissement M26 a ferme /metrics derriere une cle API. Prometheus a donc
# besoin de s'authentifier, sinon il recoit 401 et la cible passe « down ».
#
# CONTRAINTE A CONNAITRE : Prometheus ne sait PAS envoyer un en-tete arbitraire.
# Sa configuration n'expose que le bloc `authorization`, qui positionne l'en-tete
# `Authorization`. Impossible d'envoyer `X-API-Key` directement — la demande a
# ete formulee des 2016 et refusee plusieurs fois par le projet.
#
# C'est pourquoi `require_api_key` accepte DEUX en-tetes pour la meme cle :
#   X-API-Key: <cle>              -> clients applicatifs
#   Authorization: Bearer <cle>   -> Prometheus
#
# LECON A TIRER EN SEANCE : un durcissement a un cout d'integration. Fermer
# /metrics etait correct du point de vue securite, et cassait le monitoring.
# La bonne reponse n'est ni de rouvrir en silence, ni de renoncer a surveiller.
# =============================================================================

global:
  # Frequence de collecte par defaut : Prometheus interroge chaque cible
  # toutes les 15 secondes.
  scrape_interval: 15s

scrape_configs:
  # --- L'API InduSense ------------------------------------------------------
  - job_name: indusense-api
    metrics_path: /metrics

    # `authorization` positionne l'en-tete Authorization sur CHAQUE requete.
    # `type: Bearer` est la valeur par defaut, ecrite ici pour etre explicite.
    #
    # `credentials_file` plutot que `credentials` : la cle n'apparait JAMAIS
    # dans ce fichier, qui est versionne. Le fichier pointe est monte par
    # docker-compose depuis un chemin ignore par Git.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/api_key

    static_configs:
      - targets: ["api:8000"]

  # --- Exporteur de derive --------------------------------------------------
  # Cette cible arrive plus tard dans le parcours (M29). Tant que l'exporteur
  # n'est pas lance, elle reste « down » : c'est ATTENDU, pas un incident.
  # Le smoke test ne verifie que le job `indusense-api` pour cette raison.
  - job_name: indusense-drift
    static_configs:
      - targets: ["host.docker.internal:9109"]
