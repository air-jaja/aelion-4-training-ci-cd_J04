      retries: 5          # AprÃ¨s 5 Ã©checs consÃ©cutifs, la base est considÃ©rÃ©e comme "unhealthy".

  # [PÃ‰DAGOGIE] CLÃ‰ `prometheus` â€” ce champ dÃ©claratif participe au contrat de configuration.
