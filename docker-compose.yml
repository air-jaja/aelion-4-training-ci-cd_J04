      INDUSENSE_DB_URL: postgresql+psycopg://indusense:${POSTGRES_PASSWORD}@db:5432/indusense
                          # URL de connexion Ã  la base, dÃ©cortiquÃ©e :
                          #   postgresql+psycopg:// = type de base + DRIVER (psycopg 3, celui du lock ;
                          #     sans '+psycopg', SQLAlchemy chercherait psycopg2, absent) ; 'indusense' = utilisateur ;
