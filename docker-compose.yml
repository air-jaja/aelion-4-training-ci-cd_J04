  api:                    # --- SERVICE 1 : l'API InduSense (notre application web) ---
    # [PÃ‰DAGOGIE] CLÃ‰ `build` â€” ce champ dÃ©claratif participe au contrat de configuration.
    build: .              # On CONSTRUIT l'image Ã  partir du Dockerfile du dossier courant ('.').
