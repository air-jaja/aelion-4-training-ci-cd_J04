    # [PÃ‰DAGOGIE] RÃ‰SEAU â€” distingue le port publiÃ© sur l'hÃ´te du port Ã©coutÃ© dans le conteneur.
    ports: ["8000:8000"]  # Publication de port "HÃ”TE:CONTENEUR" : le 8000 de la machine est
